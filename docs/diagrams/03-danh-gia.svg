    </g>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #50677c" x="684" y="357.376289" transform="rotate(-0 684 357.376289)">Đáp án test chỉ dùng khi tính metric</text>
   </g>
   <g id="text_18">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #50677c" x="39.6" y="395.125312" transform="rotate(-0 39.6 395.125312)">Đáp án train được dùng cho GBM nếu triển khai. So cùng split: random / thứ tự file / rule / bản đầy đủ.</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ad710d" x="39.6" y="433.44" transform="rotate(-0 39.6 433.44)">B  /  NHÃN THẬT — kiểm lỗi thực tế và đo công sức review</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c43" x="52.56" y="498.425" transform="rotate(-0 52.56 498.425)">150 ảnh kiểm tay</text>
   </g>
   <g id="text_21">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 528.656445)">75 ngẫu nhiên + 75 top, không trùng</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 547.951367)">Long + Sơn kiểm độc lập, đo kappa</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c43" x="430.56" y="497.3325" transform="rotate(-0 430.56 497.3325)">Pilot cùng batch 30 ảnh</text>
   </g>
   <g id="text_23">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(430.56 528.722188)">Hai người, hai task CVAT riêng</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(430.56 549.033672)">Ưu tiên ↔ thứ tự file</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c43" x="812.16" y="497.8175" transform="rotate(-0 812.16 497.8175)">Kết quả có nguồn</text>
   </g>
   <g id="text_25">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(812.16 528.012891)">Verdict + thời gian + queue_id</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(812.16 547.625195)">So ở cùng ngân sách thời gian</text>
   </g>
   <g id="text_26">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #50677c" transform="translate(39.6 636.968945)">Mẫu kiểm tay không đại diện tự động cho toàn bộ 10k ảnh. Pilot nhỏ còn chịu ảnh hưởng tốc độ mỗi người.</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #50677c" transform="translate(39.6 656.789258)">“Time saved” tính theo số ảnh là proxy; chỉ gọi là thời gian thực đo khi có dữ liệu pilot.</text>
   </g>
  </g>
