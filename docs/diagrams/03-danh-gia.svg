   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #356ad2" x="39.6" y="32.4" transform="rotate(-0 39.6 32.4)">M13  /  03</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c43" x="39.6" y="69.12" transform="rotate(-0 39.6 69.12)">Chứng minh tìm lỗi tốt hơn, không chỉ demo chạy được</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #50677c" x="39.6" y="100.08" transform="rotate(-0 39.6 100.08)">Tách lỗi tiêm, lỗi thật và thời gian người thật · Mỗi nguồn trả lời một câu hỏi khác nhau</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #50677c" x="39.6" y="698.4" transform="rotate(-0 39.6 698.4)">NHÓM M13 · 13/10/2026</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #50677c" x="1112.4" y="698.4" transform="rotate(-0 1112.4 698.4)">Kiến trúc / phân công đề xuất · Hiện trạng chi tiết trong bản phân tích</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #356ad2" x="39.6" y="148.32" transform="rotate(-0 39.6 148.32)">A  /  THÍ NGHIỆM LỖI TIÊM — so sánh khả năng xếp hạng</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c43" x="52.56" y="213.6525" transform="rotate(-0 52.56 213.6525)">Chia theo ảnh</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 244.976445)">6k / 2k / 2k</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 264.842656)">Seed 42</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c43" x="275.76" y="214.3475" transform="rotate(-0 275.76 214.3475)">Tiêm lỗi</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(275.76 244.506719)">Theo từng split</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(275.76 263.881719)">Lưu đáp án riêng</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c43" x="498.96" y="214.12" transform="rotate(-0 498.96 214.12)">Chấm rủi ro</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(498.96 244.506719)">Không đọc đáp án</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(498.96 264.426641)">để tạo feature</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c43" x="722.16" y="214.12" transform="rotate(-0 722.16 214.12)">Chốt cấu hình</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(722.16 244.989141)">Chọn bằng val</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(722.16 263.881719)">Đóng băng model</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c43" x="945.36" y="212.9575" transform="rotate(-0 945.36 212.9575)">Đo trên test</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(945.36 244.469609)">Recall@20%</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(945.36 264.351445)">Gain / từng lỗi</text>
   </g>
   <g id="text_17">
    <g id="patch_18">
     <path d="M 582.685703 361.998867 
L 785.314297 361.998867 
L 785.314297 346.481133 
L 582.685703 346.481133 
