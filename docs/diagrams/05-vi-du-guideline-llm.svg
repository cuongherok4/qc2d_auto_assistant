   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #356ad2" x="39.6" y="34.56" transform="rotate(-0 39.6 34.56)">M13 / VÍ DỤ 1/2</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c43" x="39.6" y="71.28" transform="rotate(-0 39.6 71.28)">Guideline được gửi vào LLM để làm gì?</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #50677c" x="39.6" y="100.8" transform="rotate(-0 39.6 100.8)">Một batch có hai đầu vào: ảnh + nhãn hiện tại, và tài liệu quy định cách gán nhãn.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #50677c" x="39.6" y="914.4" transform="rotate(-0 39.6 914.4)">VÍ DỤ GIẢ LẬP · Ảnh vẽ minh họa, guideline và đầu ra model đều giả định</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c43" x="52.56" y="184.2375" transform="rotate(-0 52.56 184.2375)">01  guideline-demo.pdf · trang 2</text>
   </g>
   <g id="text_6">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 218.1075)">“Chỉ gán car và pedestrian.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 240.057969)">Bỏ qua car thấp hơn 30 pixel.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 261.757969)">Bỏ qua pedestrian thấp hơn 40 pixel.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 283.46125)">Chiều cao đo trên ảnh gốc.”</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 300.69)"/>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 326.969531)">Đây là guideline giả lập để giải thích.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c43" x="592.56" y="186.3375" transform="rotate(-0 592.56 186.3375)">02  LLM đọc văn bản và trích quy tắc</text>
   </g>
   <g id="text_8">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(592.56 218.36125)">Nhận: nội dung trang 2 + yêu cầu định dạng.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(592.56 240.06125)">Yêu cầu: lấy class, ngưỡng, đơn vị, câu trích/trang.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(592.56 261.433125)">Không có thông tin → đưa vào mục unclear.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(592.56 278.99)"/>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(592.56 305.269531)">Kết quả: bản nháp có cấu trúc để chương trình đọc.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(592.56 326.969531)">Bước này chưa chấm điểm hay kết luận ảnh sai.</text>
   </g>
   <g id="text_9">
    <g id="patch_11">
     <path d="M 499.252891 246.796289 
L 547.627109 246.796289 
L 547.627109 231.283711 
L 499.252891 231.283711 
z
" style="fill: #ffffff"/>
    </g>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #50677c" x="523.44" y="242.173711" transform="rotate(-0 523.44 242.173711)">văn bản</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c43" x="592.56" y="462.0775" transform="rotate(-0 592.56 462.0775)">03  Ví dụ nội dung spec nháp</text>
   </g>
   <g id="text_11">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(592.56 494.953125)">classes: [car, pedestrian]</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(592.56 516.458437)">min_height_px: {car: 30, pedestrian: 40}</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(592.56 539.069531)">R1: kiểm box đã gán thấp hơn ngưỡng</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(592.56 560.333125)">source: trang 2 + câu trích tương ứng</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(592.56 582.364531)">approved_by: rỗng (chưa được dùng chính thức)</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(592.56 599.59)"/>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(592.56 625.973438)">Hiển thị rút gọn; schema đầy đủ nằm trong code.</text>
   </g>
   <g id="text_12">
    <g id="patch_12">
     <path d="M 898.892812 404.476289 
L 999.027187 404.476289 
L 999.027187 388.963711 
L 898.892812 388.963711 
z
" style="fill: #ffffff"/>
    </g>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #50677c" x="948.96" y="399.853711" transform="rotate(-0 948.96 399.853711)">LLM trả bản nháp</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c43" x="52.56" y="463.2575" transform="rotate(-0 52.56 463.2575)">04  Long đọc lại nguồn và duyệt</text>
   </g>
   <g id="text_14">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 495.233125)">Đúng class? Đúng 30 / 40 px?</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 517.459219)">Có câu trích? Có tự suy diễn không?</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 534.49)"/>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 560.404219)">Đúng → ghi người duyệt và phiên bản.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 582.357969)">Sai / thiếu → sửa, hỏi lại trước khi duyệt.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 599.59)"/>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 625.757969)">Tú Anh đã viết công cụ trích xuất / editor.</text>
   </g>
   <g id="text_15">
    <g id="patch_13">
     <path d="M 496.419531 528.515664 
L 550.460469 528.515664 
L 550.460469 512.604336 
L 496.419531 512.604336 
z
" style="fill: #ffffff"/>
    </g>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #50677c" x="523.44" y="523.893086" transform="rotate(-0 523.44 523.893086)">đối chiếu</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c43" x="52.56" y="760.1075" transform="rotate(-0 52.56 760.1075)">05  Spec đã duyệt được dùng ở HAI chỗ</text>
   </g>
   <g id="text_17">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 792.309531)">Rule kiểm nhãn: box car C cao 18 px &lt; 30 px → nghi gán thừa theo R1.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 814.113438)">Lọc prediction: detector thấy car C cao 18 px → bỏ khỏi tập bắt buộc phải có nhãn.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #172c43" transform="translate(52.56 835.597969)">Nhờ vậy, một vật nhỏ được phép bỏ qua sẽ không bị báo thành “thiếu box”.</text>
   </g>
  </g>
 </g>
