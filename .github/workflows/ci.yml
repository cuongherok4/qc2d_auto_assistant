name: ci
on:
  push: {branches: [main, develop]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python 3.11 && uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/pytest -q
