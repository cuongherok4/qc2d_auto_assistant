[project]
name = "m13-reviewer-prioritization"
version = "0.1.0"
description = "Ưu tiên review nhãn detection 2D trên BDD100K"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "pyyaml>=6",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gbm = ["lightgbm>=4.1"]
detector = ["torch>=2.1", "ultralytics>=8.1"]
guideline = ["python-docx>=1.1", "pdfplumber>=0.10"]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: cần dữ liệu BDD100K thật trong data/ (tự bỏ qua nếu chưa có)"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
